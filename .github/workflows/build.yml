name: Build & release

on:
  push:
    paths-ignore: ['kash-source.zip']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (parser + insights)
        run: ./gradlew test --no-daemon

      # The signing key lives only in encrypted repository secrets, never in the code.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.KASH_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kash.jks"
            echo "KASH_KEYSTORE_PATH=$RUNNER_TEMP/kash.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret yet: building with the debug key and not publishing."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KASH_KEYSTORE_PASSWORD: ${{ secrets.KASH_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kash.jks"

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk kash.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kash-apk
          path: kash.apk
          retention-days: 14

      # Testers' QR code points at releases/latest/download/kash.apk, so it always gets the newest build.
      - name: Publish for testers
        if: env.SIGNED == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" kash.apk \
            --title "Kash 0.1.${{ github.run_number }} (test build)" \
            --latest \
            --notes "Test build for friends. Install: open kash.apk on your Android phone (Android 11+), allow 'Install unknown apps' when asked. If Kash can't get SMS permission: long-press Kash > App info > ⋮ > Allow restricted settings. Updates install over the previous version. made by T.I"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
